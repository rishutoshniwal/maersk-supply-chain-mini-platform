[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-intelligence"
version = "1.0.0"
description = "Supply Chain Intelligence Mini-Platform"
authors = [{ name = "Maersk Candidate" }]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"
